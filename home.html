<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UNDERDOGS RADIO | URM</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #121212;
      color: #ffffff;
      font-family: 'Impact', 'Arial Black', sans-serif;
      text-align: center;
      padding: 20px;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 20px;
      border-bottom: 2px solid #e50914;
    }
    .logo {
      font-size: 2rem;
      letter-spacing: 2px;
      color: #ffffff;
    }
    .logo span {
      color: #e50914;
    }
    nav a {
      color: #ffffff;
      text-decoration: none;
      margin-left: 15px;
      font-size: 1.1rem;
      text-transform: uppercase;
    }
    nav a:hover {
      color: #e50914;
    }
    .hero {
      margin: 50px 0;
    }
    .hero h1 {
      font-size: 3.5rem;
      letter-spacing: 3px;
      margin-bottom: 20px;
    }
    .btn-live {
      background-color: #e50914;
      color: white;
      border: none;
      padding: 15px 30px;
      font-size: 1.5rem;
      cursor: pointer;
      border-radius: 5px;
      text-transform: uppercase;
    }
    .btn-live:hover {
      background-color: #b20710;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-top: 40px;
    }
    .card {
      background-color: #1e1e1e;
      border: 1px solid #333;
      padding: 20px;
      border-radius: 8px;
    }
    .card h3 {
      color: #e50914;
      margin-bottom: 10px;
      font-size: 1.2rem;
    }
    .card p {
      font-family: sans-serif;
      font-size: 0.9rem;
      color: #ccc;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">U<span>RM</span></div>
    <nav>
      <a href="#">Home</a>
      <a href="#">Palinsesto</a>
      <a href="#">Podcast</a>
      <a href="#">Archivio</a>
      <a href="#">News</a>
    </nav>
  </header>

  <section class="hero">
    <h1>UNDERDOGS RADIO</h1>
    <button class="btn-live">▶ LISTEN LIVE NOW</button>
  </section>

  <section class="grid">
    <div class="card">
      <h3>ORA IN ONDA</h3>
      <p>GRINDING HOUR</p>
    </div>
    <div class="card">
      <h3>PROSSIMO SPETTACOLO</h3>
      <p>BITE BACK SESSION</p>
    </div>
    <div class="card">
      <h3>ULTIMI PODCAST</h3>
      <p>Archive 01 | Raw Beats</p>
    </div>
    <div class="card">
      <h3>ULTIME NEWS</h3>
      <p>Underdogs Radio - "Grinding Hour"</p>
    </div>
  </section>

</body>
</html>
