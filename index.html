<!DOCTYPE html>
<html lang="it" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Tailwind CSS per il layout responsivo -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts: Bebas Neue e Oswald per la tipografia condensata underground -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@400;500;700&family=Roboto+Condensed:wght@400;700&display=swap" rel="stylesheet">

    <!-- Tone.js per generare un audio synth underground di test quando si preme Play -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>

    <style>
        /* ==========================================================================
           STILI BASE E IDENTITÀ VISIVA URM (Dark, Materico, Alto Contrasto)
           ========================================================================== */
        :root {
            --bg-dark: #121212;
            --bg-panel: #1a1a1a;
            --text-main: #ffffff;
            --text-muted: #888888;
            --border-line: #2a2a2a;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Oswald', sans-serif;
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            /* Leggera grana materica di sfondo */
            background-image: radial-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 0);
            background-size: 24px 24px;
        }

        .font-display {
            font-family: 'Bebas Neue', 'Oswald', sans-serif;
            letter-spacing: 0.03em;
        }

        .font-sub {
            font-family: 'Roboto Condensed', sans-serif;
            letter-spacing: 0.06em;
        }

        /* Filtro Bianco & Nero ad alto contrasto per tutte le foto */
        .urm-photo {
            filter: grayscale(100%) contrast(125%) brightness(92%);
            transition: filter 0.3s ease, transform 0.45s ease;
        }

        .urm-photo:hover,
        .group:hover .urm-photo {
            filter: grayscale(100%) contrast(138%) brightness(100%);
        }

        /* Animazione morbida cambio sezione */
        .view-section {
            display: none;
            animation: fadeIn 0.28s ease-out forwards;
        }

        .view-section.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Effetto pulsante circolare Play */
        .play-circle-btn {
            transition: transform 0.18s ease, background-color 0.18s ease;
        }
        .play-circle-btn:hover {
            transform: scale(1.07);
            background-color: #e5e5e5;
        }
        .play-circle-btn:active {
            transform: scale(0.96);
        }

        /* Indicatore onda sonora animata quando in riproduzione */
        .equalizer-bar {
            width: 3px;
            background-color: #ffffff;
            animation: eqPulse 0.6s infinite ease-in-out alternate;
        }
        .equalizer-bar:nth-child(2) { animation-delay: 0.2s; }
        .equalizer-bar:nth-child(3) { animation-delay: 0.4s; }

        @keyframes eqPulse {
            0% { height: 4px; }
            100% { height: 16px; }
        }

        /* Scrollbar minimalista */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #131313; }
        ::-webkit-scrollbar-thumb { background: #333333; border-radius: 3px; }
    </style>
</head>
<body class="selection:bg-white selection:text-black">

            <span class="text-neutral-600 select-none">|</span>

                        <span id="player-title" class="font-display text-xl tracking-wide text-white truncate">THE GRINDING HOUR</span>
                    </div>
                    <div id="player-subtitle" class="font-sub text-xs text-neutral-400 uppercase truncate">URM — UNDERDOGS RADIO MOVEMENT</div>
                </div>
            </div>

            <!-- Controllo Volume, Equalizzatore e Stop -->
            <div class="flex items-center gap-4 sm:gap-6 shrink-0">
                <div class="hidden sm:flex items-center gap-2">
                    <span class="font-sub text-[11px] text-neutral-500 uppercase tracking-wider">VOL</span>
                    <input type="range" id="volume-slider" min="0" max="100" value="80" oninput="updateVolume(this.value)" aria-label="Volume" class="w-20 accent-white bg-neutral-800 h-1 cursor-pointer">
                </div>
                <div id="player-eq" class="flex items-end gap-1 h-4">
                    <div class="equalizer-bar"></div>
                    <div class="equalizer-bar"></div>
                    <div class="equalizer-bar"></div>
                </div>
                <button onclick="stopAllAudio()" class="text-xs text-neutral-500 hover:text-white uppercase tracking-wider">STOP</button>
            </div>
        </div>
    </div>

         FOOTER MINIMALISTA (Social | Donazioni | Contatti)
         ========================================================================== -->
    <footer class="w-full max-w-6xl mx-auto px-6 py-8 mt-auto text-center">

            <div id="modal-body" class="font-sub text-neutral-300 text-base space-y-4 leading-relaxed">
                <!-- Contenuto dinamico -->
            </div>
        </div>
    </div>

        // Carica i dati aggiornati da Pages CMS (dati/radio.json) quando il sito è online
        async function loadExternalRadioData() {
            try {
                const response = await fetch('dati/radio.json?t=' + Date.now());
                if (!response.ok) return;
                const externalData = await response.json();
                if (externalData && typeof externalData === 'object') {
                    RADIO_DATA = {
                        ...RADIO_DATA,
                        ...externalData,
                        live: { ...RADIO_DATA.live, ...(externalData.live || {}) },
                        palinsesto: { ...RADIO_DATA.palinsesto, ...(externalData.palinsesto || {}) }
                    };
                    applyLiveDataToHome();
                }
            } catch (err) {
                console.warn('Uso dati integrati (normale se testato in locale senza server):', err);
            }
        }

        function applyLiveDataToHome() {
            if (!RADIO_DATA.live) return;
            const titleEl = document.getElementById('home-live-title');
            const subEl = document.getElementById('home-live-sub');
            const imgEl = document.getElementById('home-live-img');
            if (titleEl && RADIO_DATA.live.titolo) titleEl.textContent = RADIO_DATA.live.titolo;
            if (subEl && RADIO_DATA.live.sottotitolo) subEl.textContent = RADIO_DATA.live.sottotitolo;
            if (imgEl && RADIO_DATA.live.immagine) imgEl.src = RADIO_DATA.live.immagine;

        /* --------------------------------------------------------------------------
           7. GESTIONE PLAYER AUDIO (Web Audio / Tone.js di test)
           -------------------------------------------------------------------------- */
        async function startDemoSynth() {
            await Tone.start();
            if (!synthLoop) {
                mainSynth = new Tone.MembraneSynth({
                    pitchDecay: 0.05,
                    octaves: 4,
                    oscillator: { type: "sine" },
                    envelope: { attack: 0.001, decay: 0.3, sustain: 0.01, release: 0.8 }
                }).toDestination();
                mainSynth.volume.value = -14;

                const notes = ["C2", "C2", "G1", "A#1"];
                let step = 0;
                synthLoop = new Tone.Loop((time) => {
                    mainSynth.triggerAttackRelease(notes[step % notes.length], "8n", time);
                    step++;
                }, "4n").start(0);
            }
            Tone.Transport.start();
        }

        function pauseDemoSynth() {
            if (typeof Tone !== 'undefined') {
                Tone.Transport.pause();
            }
        }

        function updateVolume(val) {
            if (mainSynth) {
                // Converte 0-100 in decibel (-40dB a -4dB)
                mainSynth.volume.value = val == 0 ? -Infinity : -40 + (val / 100) * 36;
            }
        }

        function toggleLiveStream() {
            if (isPlaying && currentTrackId === 'live') {
                isPlaying = false;
                pauseDemoSynth();
            } else {
                isPlaying = true;
                currentTrackId = 'live';
                startDemoSynth();
                updateBottomPlayer("LIVE", RADIO_DATA.live.titolo, RADIO_DATA.live.sottotitolo);
            }
            syncAudioUI();
        }

        function playPodcast(podId) {
            const pod = RADIO_DATA.podcasts.find(p => p.id === podId);
            if (!pod) return;

            if (isPlaying && currentTrackId === podId) {
                isPlaying = false;
                pauseDemoSynth();
            } else {
                isPlaying = true;
                currentTrackId = podId;
                startDemoSynth();
                updateBottomPlayer("PODCAST", pod.titolo, `${pod.host} • ${pod.durata}`);
            }
            syncAudioUI();
        }

        function playArchiveItem(archId) {
            const item = RADIO_DATA.archivio.find(a => a.id === archId);
            if (!item) return;

            if (isPlaying && currentTrackId === archId) {
                isPlaying = false;
                pauseDemoSynth();
            } else {
                isPlaying = true;
                currentTrackId = archId;
                startDemoSynth();
                updateBottomPlayer("ARCHIVIO", item.titolo, `${item.host} • ${item.genere} (${item.anno})`);
            }
            syncAudioUI();
        }

        function toggleGlobalAudio() {
            if (!currentTrackId) return;
            if (isPlaying) {
                isPlaying = false;
                pauseDemoSynth();
            } else {
                isPlaying = true;
                startDemoSynth();
            }
            syncAudioUI();
        }

        function stopAllAudio() {
            isPlaying = false;
            currentTrackId = null;
            pauseDemoSynth();
            document.getElementById('bottom-player').classList.add('translate-y-full');
            syncAudioUI();
        }

        function updateBottomPlayer(badge, title, subtitle) {
            const bar = document.getElementById('bottom-player');
            document.getElementById('player-badge').textContent = badge;
            document.getElementById('player-title').textContent = title;
            document.getElementById('player-subtitle').textContent = subtitle;
            bar.classList.remove('translate-y-full');
        }

        function syncAudioUI() {
            // Aggiorna tasto Home
            const isLiveActive = isPlaying && currentTrackId === 'live';
            document.getElementById('home-icon-play').classList.toggle('hidden', isLiveActive);
            document.getElementById('home-icon-pause').classList.toggle('hidden', !isLiveActive);
            document.getElementById('home-status-top').textContent = isLiveActive ? "STREAMING IN CORSO" : "LISTEN LIVE NOW";
            document.getElementById('live-dot').className = isLiveActive 
                ? "w-2 h-2 rounded-full bg-red-500 animate-ping" 
                : "w-2 h-2 rounded-full bg-neutral-500";

            // Aggiorna barra player in basso
            document.getElementById('bar-icon-play').classList.toggle('hidden', isPlaying);
            document.getElementById('bar-icon-pause').classList.toggle('hidden', !isPlaying);
            document.getElementById('player-eq').style.opacity = isPlaying ? '1' : '0.2';

            // Aggiorna icone nelle liste Podcast e Archivio
            renderPodcasts(currentCategory);
            renderArchive();
        }

        /* --------------------------------------------------------------------------
           8. MODALI DEL FOOTER (Social, Donazioni, Contatti)
           -------------------------------------------------------------------------- */
        function openInfoModal(type) {
            const modal = document.getElementById('info-modal');
            const meta = document.getElementById('modal-meta');
            const title = document.getElementById('modal-title');
            const body = document.getElementById('modal-body');

            meta.classList.add('hidden');

            if (type === 'social') {
                title.textContent = "SEGUI URM";
                body.innerHTML = `
                    <p>Resta connesso con l'underground. Seguici sui nostri canali ufficiali:</p>
                    <div class="flex flex-col gap-2 pt-2">
                        <a href="#" class="border border-neutral-700 px-4 py-2 hover:bg-white hover:text-black transition-colors">INSTAGRAM — @UNDERDOGS.RADIO</a>
                        <a href="#" class="border border-neutral-700 px-4 py-2 hover:bg-white hover:text-black transition-colors">SOUNDCLOUD — URM ARCHIVES</a>
                        <a href="#" class="border border-neutral-700 px-4 py-2 hover:bg-white hover:text-black transition-colors">MIXCLOUD — URM LIVE SESSIONS</a>
                    </div>
                `;
            } else if (type === 'donazioni') {
                title.textContent = "SUPPORTA LA RADIO";
                body.innerHTML = `
                    <p>URM è una web radio indipendente, libera e senza pubblicità. Ogni contributo aiuta a mantenere attivi i server e lo studio.</p>
                    <div class="pt-2">
                        <a href="#" class="inline-block w-full text-center bg-white text-black font-display text-xl py-2.5 tracking-wider hover:bg-neutral-200 transition-colors">DONA ORA / PAYPAL & KO-FI</a>
                    </div>
                `;
            } else if (type === 'contatti') {
                title.textContent = "CONTATTI & DEMO";
                body.innerHTML = `
                    <p>Vuoi proporre un programma, inviare un DJ set o collaborare con Underdogs Radio Movement?</p>
                    <p class="text-white font-bold pt-1">EMAIL: INFO@UNDERDOGS-RADIO.IT</p>
                `;
            }

            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeInfoModal(event) {
            if (event && event.target !== event.currentTarget) return;
            const modal = document.getElementById('info-modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        /* --------------------------------------------------------------------------
           9. INIZIALIZZAZIONE AL CARICAMENTO PAGINA
           -------------------------------------------------------------------------- */
        window.onload = async function() {
            applyLiveDataToHome();
            renderSchedule('MER');
            renderPodcasts('TUTTI');
            renderArchive();
            renderNews();

            await loadExternalRadioData();
            applyLiveDataToHome();
            renderSchedule(currentDay);
            renderPodcasts(currentCategory);
            renderArchive();
            renderNews();
        };
    </script>
</body>
</html>
